# A CI configuration to auto-publish pub packages.

name: Publish
permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+' ]

jobs:
  publish:
    uses: dart-lang/ecosystem/.github/workflows/publish.yaml@fc3dd9a17a8e18b3b4aa5abac8a0f4a679fe2d57
    permissions:
      id-token: write
      pull-requests: write
