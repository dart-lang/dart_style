# A CI configuration to auto-publish pub packages.
#
# Publish checks on pull requests run in the Health workflow.

name: Publish
permissions:
  contents: read

on:
  push:
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+*' ]

jobs:
  publish:
    if: ${{ github.repository_owner == 'dart-lang' }}
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@a1d8526c926344e01ba48a7368788c05ac98cb29 # main
    with:
      use-flutter: false
